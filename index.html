<script type="module">
// ========== Three.js（按需加载：只有需要 GLB 导出时才会拉取）==========
let THREE = null;
let GLTFExporterClass = null;
let _threeLoadPromise = null;

async function ensureThreeLoaded() {
  if (THREE && GLTFExporterClass) return;
  if (_threeLoadPromise) return _threeLoadPromise;
  _threeLoadPromise = (async () => {
    const threeMod = await import("three");
    THREE = threeMod;
    const expMod = await import("three/addons/exporters/GLTFExporter.js");
    GLTFExporterClass = expMod.GLTFExporter;
  })();
  return _threeLoadPromise;
}

// ========== FGMTP 逻辑移植 ==========

const FIELDS_PER_OBJECT = 15;
const PNG_SIG_DECIMAL = [137, 80, 78, 71, 13, 10, 26, 10];

function toFloat(s) {
  const n = parseFloat(s);
  return isNaN(n) ? 0.0 : n;
}

function toInt(s, def) {
  const n = parseInt(s, 10);
  return isNaN(n) ? (def || 0) : n;
}

function decimalLinesToBytes(linesArr) {
  const nums = [];
  for (let i = 0; i < linesArr.length; i++) {
    const s = linesArr[i];
    if (s === '' || s === '~') continue;
    const n = parseInt(s, 10);
    if (!isNaN(n)) nums.push(n);
  }
  let iendIdx = -1;
  for (let i = 0; i <= nums.length - 4; i++) {
    if (nums[i] === 73 && nums[i+1] === 73 && nums[i+2] === 78 && nums[i+3] === 68) {
      iendIdx = i;
      break;
    }
  }
  const end = iendIdx !== -1 ? iendIdx + 8 : nums.length;
  return new Uint8Array(nums.slice(0, end));
}

function extractNamedTextures(sectionBytesStr, lineEnding) {
  const lines = sectionBytesStr.split(lineEnding);
  const starts = [];
  let i = 0;
  while (i <= lines.length - 8) {
    let match = true;
    for (let j = 0; j < 8; j++) {
      if (parseInt(lines[i + j], 10) !== PNG_SIG_DECIMAL[j]) { match = false; break; }
    }
    if (match) { starts.push(i); i += 8; }
    else { i++; }
  }
  const results = [];
  for (let idx = 0; idx < starts.length; idx++) {
    const s = starts[idx];
    const nameIdx = s - 1;
    let name;
    if (nameIdx >= 0 && lines[nameIdx] && lines[nameIdx] !== '') {
      name = lines[nameIdx];
    } else {
      name = 'texture_' + idx;
    }
    const end = idx + 1 < starts.length ? starts[idx + 1] - 1 : lines.length;
    try {
      results.push([name, decimalLinesToBytes(lines.slice(s, end))]);
    } catch (e) {}
  }
  return results;
}

function parseV1(text) {
  const sepChar = '§';
  const sepIdx = text.indexOf(sepChar);
  if (sepIdx === -1) throw new Error("未找到 '§' 分段标记");

  const afterSep = text.substring(sepIdx + 1);
  const lineEnding = afterSep.startsWith('\r\n') ? '\r\n' : '\n';
  const sep = sepChar + lineEnding;

  const sections = text.split(sep);
  if (sections.length < 7) throw new Error("分段不足，期望至少 7 段，实际 " + sections.length);

  const lines = (section) => section.split(lineEnding).filter(x => x.length > 0);

  const header = lines(sections[0]);
  const meta = lines(sections[1]);
  const sky = lines(sections[2]);

  const spawnPoints = [];
  const metaRest = meta.slice(3);
  for (let i = 0; i <= metaRest.length - 6; i += 6) {
    const chunk = metaRest.slice(i, i + 6);
    spawnPoints.push({
      position: { x: toFloat(chunk[0]), y: toFloat(chunk[1]), z: toFloat(chunk[2]) },
      rotation: { x: toFloat(chunk[3]), y: toFloat(chunk[4]), z: toFloat(chunk[5]) }
    });
  }
  const spawn = spawnPoints.length > 0 ? spawnPoints[0] : {
    position: { x: 0.0, y: 0.0, z: 0.0 },
    rotation: { x: 0.0, y: 0.0, z: 0.0 }
  };

  const skyInfo = {
    skyboxIndex: sky.length > 0 ? toInt(sky[0]) : 0,
    lightRotation: {
      x: sky.length > 1 ? toFloat(sky[1]) : 0.0,
      y: sky.length > 2 ? toFloat(sky[2]) : 0.0,
      z: sky.length > 3 ? toFloat(sky[3]) : 0.0
    },
    lightIntensity: sky.length > 4 ? toFloat(sky[4]) : 1.0,
    fogStart: sky.length > 5 ? toFloat(sky[5]) : 0.0,
    fogEnd: sky.length > 6 ? toFloat(sky[6]) : 0.0,
    fogColorHex: sky.length > 7 ? sky[7] : "FFFFFF"
  };

  const objLines = lines(sections[6]);
  const objects = [];
  for (let i = 0; i + FIELDS_PER_OBJECT <= objLines.length; i += FIELDS_PER_OBJECT) {
    const chunk = objLines.slice(i, i + FIELDS_PER_OBJECT);
    objects.push({
      material: chunk[0],
      tileMode: chunk[1],
      visible: chunk[2] === "True",
      collisions: chunk[3] === "True",
      physics: chunk[4] === "True",
      texture: chunk[5],
      position: { x: toFloat(chunk[6]), y: toFloat(chunk[7]), z: toFloat(chunk[8]) },
      rotation: { x: toFloat(chunk[9]), y: toFloat(chunk[10]), z: toFloat(chunk[11]) },
      scale: { x: toFloat(chunk[12]), y: toFloat(chunk[13]), z: toFloat(chunk[14]) }
    });
  }

  const previews = [];
  for (const idx of [3, 4]) {
    try {
      const previewBytes = decimalLinesToBytes(sections[idx].split(lineEnding));
      if (previewBytes.length > 0) {
        previews.push(['preview_' + idx + '.png', previewBytes]);
      }
    } catch (e) {}
  }

  const textures = extractNamedTextures(sections[5], lineEnding);

  return {
    map_name: header.length > 1 ? header[1] : "unknown",
    description: header.length > 2 ? header[2] : "",
    date: meta.length > 2 ? meta[2] : "",
    spawn: spawn,
    sky: skyInfo,
    objects: objects,
    previews: previews,
    textures: textures,
    format: "V1"
  };
}

function parseV2(data) {
  const spawnPoints = data.spawnPoints || [];
  const spawn = spawnPoints.length > 0 ? spawnPoints[0] : {
    position: { x: 0.0, y: 0.0, z: 0.0 },
    rotation: { x: 0.0, y: 0.0, z: 0.0 }
  };

  const sky = data.skySettings || {};
  const skyInfo = {
    skyboxIndex: sky.skyboxIndex !== undefined ? sky.skyboxIndex : (data.selectedAmbience || 0),
    lightRotation: sky.lightRotation || { x: 0.0, y: 0.0, z: 0.0 },
    lightIntensity: sky.lightIntensity !== undefined ? sky.lightIntensity : 1.0,
    fogStart: sky.fogStart !== undefined ? sky.fogStart : 0.0,
    fogEnd: sky.fogEnd !== undefined ? sky.fogEnd : 0.0,
    fogColorHex: sky.fogColorHex || "FFFFFF"
  };

  const objects = (data.mapCubes || []).map(cube => ({
    material: cube.tag || "",
    tileMode: cube.tileMode !== undefined ? cube.tileMode : 0,
    visible: cube.visible !== undefined ? cube.visible : true,
    collisions: cube.collisions !== undefined ? cube.collisions : true,
    physics: cube.physics !== undefined ? cube.physics : false,
    texture: cube.materialName || "",
    position: cube.position || { x: 0.0, y: 0.0, z: 0.0 },
    rotation: cube.rotation || { x: 0.0, y: 0.0, z: 0.0 },
    scale: cube.scale || { x: 1.0, y: 1.0, z: 1.0 }
  }));

  const textures = [];
  for (const tex of (data.customTextures || [])) {
    try {
      textures.push([tex.name || "texture", base64ToBytes(tex.base64Data || "")]);
    } catch (e) {}
  }

  const previews = [];
  for (const [key, name] of [["iconBase64", "preview_icon.png"], ["bannerBase64", "preview_banner.png"]]) {
    if (data[key]) {
      try {
        previews.push([name, base64ToBytes(data[key])]);
      } catch (e) {}
    }
  }

  return {
    map_name: data.name || "unknown",
    description: data.description || "",
    date: data.exportDate || "",
    spawn: spawn,
    sky: skyInfo,
    objects: objects,
    previews: previews,
    textures: textures,
    format: "V2"
  };
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function parseGbmap(text) {
  const trimmed = text.replace(/^\s+/, '');
  if (trimmed.charAt(0) === '{') {
    return parseV2(JSON.parse(text));
  }
  return parseV1(text);
}

function buildProject(mapData) {
  const projectFile = {
    version: 4,
    name: mapData.map_name,
    description: mapData.description,
    lastModified: mapData.date,
    selectedAmbience: mapData.sky.skyboxIndex,
    spawnPoints: [mapData.spawn],
    skySettings: mapData.sky
  };

  const cubes = mapData.objects.map(obj => ({
    name: "MapCube",
    tag: obj.material,
    tileMode: parseInt(obj.tileMode),
    visible: obj.visible,
    collisions: obj.collisions,
    physics: obj.physics,
    materialName: obj.texture,
    position: obj.position,
    rotation: obj.rotation,
    scale: obj.scale
  }));

  const mapDataOut = { version: 4, cubes: cubes };

  return {
    projectFile: projectFile,
    mapData: mapDataOut,
    textures: mapData.textures,
    previews: mapData.previews
  };
}

function sanitizeName(name) {
  return (name || 'project').replace(/[\\/:*?"<>|]/g, '_').trim();
}

// ==========================================================================
// ==================== GB → GLB 导出 ========================================
// ==========================================================================

function normalizeUnitySignedAngle(deg) {
  const d = parseFloat(deg) || 0;
  const wrapped = ((d + 180) % 360 + 360) % 360 - 180;
  return wrapped === -180 ? 180 : wrapped;
}

function unityEulerDegToThreeQuaternion(rotation) {
  rotation = rotation || { x: 0, y: 0, z: 0 };
  const rx = THREE.MathUtils.degToRad(normalizeUnitySignedAngle(rotation.x));
  const ry = THREE.MathUtils.degToRad(normalizeUnitySignedAngle(rotation.y));
  const rz = THREE.MathUtils.degToRad(normalizeUnitySignedAngle(rotation.z));
  return new THREE.Quaternion()
    .setFromEuler(new THREE.Euler(-rx, -ry, rz, "YXZ"))
    .normalize();
}

// 检测 PNG 是否有 alpha
function detectImageAlpha(img) {
  try {
    const size = 64;
    const c = document.createElement("canvas");
    c.width = size;
    c.height = size;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    const data = ctx.getImageData(0, 0, size, size).data;
    for (let i = 3; i < data.length; i += 4) {
      if (data[i] < 250) return true;
    }
  } catch (e) {}
  return false;
}

// 字节 → THREE.Texture
function bytesToThreeTexture(bytes, name) {
  return new Promise((resolve, reject) => {
    let url;
    try {
      const blob = new Blob([bytes], { type: "image/png" });
      url = URL.createObjectURL(blob);
    } catch (e) { reject(e); return; }

    const img = new Image();
    img.onload = () => {
      try {
        const tex = new THREE.Texture(img);
        tex.name = String(name || "texture");
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.generateMipmaps = false;

        const hasAlpha = detectImageAlpha(img);
        tex.userData = tex.userData || {};
        tex.userData.hasAlpha = hasAlpha;

        tex.needsUpdate = true;
        resolve(tex);
      } catch (e) { reject(e); }
      finally { try { URL.revokeObjectURL(url); } catch (e) {} }
    };
    img.onerror = () => {
      try { URL.revokeObjectURL(url); } catch (e) {}
      reject(new Error("纹理图片解码失败: " + name));
    };
    img.src = url;
  });
}

// 按 tileMode 生成带平铺 UV 的几何体（带缓存）
const geometryCache = new Map();

function getTiledBoxGeometry(sx, sy, sz, tileMode) {
  const key = sx.toFixed(3) + "_" + sy.toFixed(3) + "_" + sz.toFixed(3) + "_" + tileMode;
  if (geometryCache.has(key)) return geometryCache.get(key);

  const geo = new THREE.BoxGeometry(1, 1, 1);

  if (tileMode === 0 || tileMode === 1) {
    const uvs = geo.attributes.uv;
    const array = uvs.array;
    let rw = 1, rh = 1;
    for (let i = 0; i < 6; i++) {
      if (i === 0 || i === 1) { rw = sz; rh = sy; }
      else if (i === 2 || i === 3) { rw = sx; rh = sz; }
      else { rw = sx; rh = sy; }
      const offset = i * 8;
      if (tileMode === 1) {
        array[offset + 0] = rw; array[offset + 1] = 0;
        array[offset + 2] = 0;  array[offset + 3] = 0;
        array[offset + 4] = rw; array[offset + 5] = rh;
        array[offset + 6] = 0;  array[offset + 7] = rh;
      } else {
        array[offset + 0] = 0;  array[offset + 1] = rh;
        array[offset + 2] = rw; array[offset + 3] = rh;
        array[offset + 4] = 0;  array[offset + 5] = 0;
        array[offset + 6] = rw; array[offset + 7] = 0;
      }
    }
    uvs.needsUpdate = true;
  }

  geometryCache.set(key, geo);
  return geo;
}

function disposeGeometryCache() {
  geometryCache.forEach(geo => {
    try { geo.dispose(); } catch (e) {}
  });
  geometryCache.clear();
}

function disposeThreeScene(scene) {
  if (!scene) return;
  scene.traverse(obj => {
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => {
        if (!m) return;
        if (m.map && typeof m.map.dispose === "function") {
          try { m.map.dispose(); } catch (e) {}
        }
        if (typeof m.dispose === "function") {
          try { m.dispose(); } catch (e) {}
        }
      });
    }
  });
  disposeGeometryCache();
}

async function buildThreeScene(mapData, proj) {
  const scene = new THREE.Scene();
  scene.name = sanitizeName(mapData.map_name) || "GBMap";

  // 1) 预解码纹理
  const textureCache = new Map();
  for (const [name, bytes] of (proj.textures || [])) {
    try {
      const tex = await bytesToThreeTexture(bytes, name);
      textureCache.set(name, tex);
    } catch (e) {
      console.warn("[GLB] 纹理解码失败:", name, e && e.message);
    }
  }

  // 2) 材质缓存
  const materialCache = new Map();
  const getMaterial = (textureName, tex) => {
    const hasAlpha = !!(tex && tex.userData && tex.userData.hasAlpha);
    const key = (textureName || "__default__") + (hasAlpha ? "__A" : "");
    if (materialCache.has(key)) return materialCache.get(key);

    const mat = new THREE.MeshStandardMaterial({
      map: tex || null,
      color: 0xffffff,
      metalness: 1.0,   // 默认最大
      roughness: 1.0,   // 默认最大
      side: THREE.DoubleSide
    });

    if (hasAlpha) {
      mat.transparent = true;
      mat.depthWrite = true;
    }

    mat.name = "Mat_" + key;
    materialCache.set(key, mat);
    return mat;
  };

  // 3) 逐块生成 mesh
  const objs = mapData.objects || [];
  for (let i = 0; i < objs.length; i++) {
    const obj = objs[i];
    const tex = textureCache.get(obj.texture) || null;
    const mat = getMaterial(obj.texture, tex);

    const sx = Math.max(0.0001, (obj.scale && obj.scale.x) || 1);
    const sy = Math.max(0.0001, (obj.scale && obj.scale.y) || 1);
    const sz = Math.max(0.0001, (obj.scale && obj.scale.z) || 1);

    let tileMode = parseInt(obj.tileMode, 10);
    if (!Number.isFinite(tileMode)) tileMode = 2;

    const geo = getTiledBoxGeometry(sx, sy, sz, tileMode);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.name = "MapCube_" + i;

    const px = (obj.position && obj.position.x) || 0;
    const py = (obj.position && obj.position.y) || 0;
    const pz = -((obj.position && obj.position.z) || 0);
    mesh.position.set(px, py, pz);
    mesh.quaternion.copy(unityEulerDegToThreeQuaternion(obj.rotation));
    mesh.scale.set(sx, sy, sz);

    mesh.userData = {
      material: obj.material || "",
      tileMode: tileMode,
      visible: obj.visible !== false,
      collisions: obj.collisions !== false,
      physics: obj.physics === true
    };

    // 隐藏方块也导出（保留信息），用 userData 标记
    if (obj.visible === false) mesh.visible = true;

    scene.add(mesh);
  }

  return scene;
}

async function exportSceneToGLB(scene) {
  if (!GLTFExporterClass) await ensureThreeLoaded();
  const exporter = new GLTFExporterClass();
  return await exporter.parseAsync(scene, {
    binary: true,
    onlyVisible: true,
    trs: true,
    includeCustomExtensions: false
  });
}

async function mapDataToGLB(mapData, proj) {
  await ensureThreeLoaded();
  const scene = await buildThreeScene(mapData, proj);
  try {
    return await exportSceneToGLB(scene);
  } finally {
    disposeThreeScene(scene);
  }
}

// 触发浏览器下载
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function applyLang() {
  try {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (i18n[currentLang][key] !== undefined) {

      }
    });

    const langEnBtn = document.getElementById('langEn');
    if (langZhBtn) langZhBtn.classList.toggle('active', currentLang === 'zh');

// ========== 界面逻辑 ==========

const dz = document.getElementById('dz');
const fileInput = document.getElementById('fileInput');
const filelist = document.getElementById('filelist');
const convertBtn = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const exportModelsBtn = document.getElementById('exportModelsBtn');
const logEl = document.getElementById('log');

let files = [];
let outputBlob = null;

document.getElementById('langZh').addEventListener('click', () => {
  currentLang = 'zh';
  try { localStorage.setItem('gbmap_lang', 'zh'); } catch(e) {}
  applyLang();
});
document.getElementById('langEn').addEventListener('click', () => {
  currentLang = 'en';
  try { localStorage.setItem('gbmap_lang', 'en'); } catch(e) {}
  applyLang();
});

function log(msg) {
  logEl.classList.add('show');
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}
function resetLog() { logEl.textContent = ''; logEl.classList.remove('show'); }

// 拖拽
['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, e => {
  e.preventDefault(); dz.classList.add('drag');
}));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => {
  e.preventDefault(); dz.classList.remove('drag');
}));
dz.addEventListener('drop', e => {
  const f = e.dataTransfer.files;
  if (f.length > 0) addFiles(f);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length > 0) addFiles(e.target.files);
});

function refreshButtons() {
  const hasFiles = files.length > 0;
  convertBtn.disabled = !hasFiles;
  exportModelsBtn.disabled = !hasFiles;
  if (!hasFiles) downloadBtn.disabled = true;
}

function addFiles(newFiles) {
  for (let i = 0; i < newFiles.length; i++) {
    const f = newFiles[i];
    if (f.name.toLowerCase().endsWith('.gbmap')) {
      files.push({ file: f, status: 'pending', result: null, error: null, logInfo: null });
    }
  }
  renderFileList();
  downloadBtn.disabled = true;
  outputBlob = null;
  refreshButtons();
  fileInput.value = '';
}

function removeFile(idx) {
  files.splice(idx, 1);
  renderFileList();
  downloadBtn.disabled = true;
  outputBlob = null;
  refreshButtons();
}

// ★ 单个文件的 GLB 导出（每行的 📦 小按钮）
async function exportSingleGLB(idx) {
  const item = files[idx];
  if (!item) return;

  try {
    await ensureThreeLoaded();
  } catch (e) {
    alert('Three.js 加载失败: ' + (e && e.message || e));
    return;
  }

  const prevStatus = item.status;
  item.status = 'processing';
  renderFileList();

  try {
    const text = await item.file.text();
    const mapData = parseGbmap(text);
    const proj = buildProject(mapData);
    const glbBuffer = await mapDataToGLB(mapData, proj);

    const fname = sanitizeName(mapData.map_name) + '.glb';
    triggerDownload(new Blob([glbBuffer], { type: 'model/gltf-binary' }), fname);

    log('[✓] ' + item.file.name + '  →  ' + fname
      + '  (' + (glbBuffer.byteLength / 1024).toFixed(1) + ' KB)');
    item.status = prevStatus === 'done' ? 'done' : 'done';
  } catch (e) {
    console.error('[Single GLB]', e);
    log('[✗] ' + item.file.name + '  GLB: ' + (e && e.message || e));
    item.status = prevStatus === 'error' ? 'error' : prevStatus;
    alert('GLB 导出失败: ' + (e && e.message || e));
  }
  renderFileList();
}

function renderFileList() {
  if (files.length === 0) {
    filelist.classList.remove('show');
    return;
  }
  filelist.classList.add('show');
  filelist.innerHTML = '';
  files.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'file-item';

    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = item.file.name;

    const status = document.createElement('span');
    status.className = 'file-status';
    if (item.status === 'pending') status.textContent = t('status_pending');
    else if (item.status === 'processing') status.textContent = t('status_processing');
    else if (item.status === 'done') { status.textContent = t('status_done'); status.classList.add('ok'); }
    else if (item.status === 'error') { status.textContent = t('status_error'); status.classList.add('err'); }

    // 每行单独的 GLB 按钮
    const glbBtn = document.createElement('button');
    glbBtn.className = 'file-export-glb';
    glbBtn.title = t('export_glb_tooltip');
    glbBtn.innerHTML =
      '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">' +
      '<path d="M8 1.5L14 5v6l-6 3.5L2 11V5L8 1.5z"/>' +
      '<path d="M8 1.5V8m0 0L14 5M8 8l-6-3M8 8v6.5"/>' +
      '</svg><span>GLB</span>';
    glbBtn.disabled = (item.status === 'processing');
    glbBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      exportSingleGLB(idx);
    });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'file-remove';
    removeBtn.textContent = '✕';
    removeBtn.title = t('remove_tooltip');
    removeBtn.addEventListener('click', () => removeFile(idx));

    div.appendChild(name);
    div.appendChild(status);
    div.appendChild(glbBtn);
    div.appendChild(removeBtn);
    filelist.appendChild(div);
  });
}

// ========== 转换流程（ZIP） ==========
convertBtn.addEventListener('click', async () => {
  if (files.length === 0) return;
  convertBtn.disabled = true;
  downloadBtn.disabled = true;
  exportModelsBtn.disabled = true;
  resetLog();
  log(t('log_start').replace('{n}', files.length) + '\n');

  const zip = new JSZip();
  let successCount = 0;

  for (let i = 0; i < files.length; i++) {
    const item = files[i];
    item.status = 'processing';
    renderFileList();

    try {
      const text = await item.file.text();
      const mapData = parseGbmap(text);
      const proj = buildProject(mapData);

      const folderName = sanitizeName(mapData.map_name) + '_project';
      const root = zip.folder(folderName);

      root.file('ProjectFile.json', JSON.stringify(proj.projectFile, null, 4));
      root.file('MapData.json', JSON.stringify(proj.mapData, null, 2));

      const texFolder = root.folder('CustomTextures');
      for (const [name, bytes] of proj.textures) {
        texFolder.file(name + '.png', bytes);
      }

      const previews = proj.previews;
      if (previews.length >= 2) {
        root.file('Icon.png', previews[0][1]);
        root.file('Banner.png', previews[1][1]);
      } else if (previews.length === 1) {
        root.file('Icon.png', previews[0][1]);
      }

      item.status = 'done';
      item.result = proj;
      item.logInfo = {
        format: mapData.format,
        objects: mapData.objects.length,
        textures: proj.textures.length
      };
      successCount++;
      log('[✓] ' + item.file.name
        + '  (' + mapData.format
        + ', ' + mapData.objects.length + ' ' + t('log_objects')
        + ', ' + proj.textures.length + ' ' + t('log_textures')
        + ')');
    } catch (e) {
      item.status = 'error';
      item.error = e.message;
      log('[✗] ' + item.file.name + '  ' + t('log_error') + ': ' + e.message);
    }
    renderFileList();
  }

  log('\n' + t('log_done').replace('{s}', successCount).replace('{n}', files.length));

  if (successCount > 0) {
    outputBlob = await zip.generateAsync({ type: 'blob' });
    downloadBtn.disabled = false;
    log(t('log_download_hint'));
  }

  convertBtn.disabled = false;
  exportModelsBtn.disabled = false;
});

// ========== ★ 独立的"导出模型"按钮 ==========
exportModelsBtn.addEventListener('click', async () => {
  if (files.length === 0) {
    log(t('log_export_models_none'));
    return;
  }

  convertBtn.disabled = true;
  downloadBtn.disabled = true;
  exportModelsBtn.disabled = true;
  resetLog();

  log(t('log_glb_loading'));
  try {
    await ensureThreeLoaded();
    log('Three.js ✓ (r160)\n');
  } catch (e) {
    console.error('[ExportModels] Three.js 加载失败:', e);
    log('⚠ ' + (e.message || e));
    convertBtn.disabled = false;
    exportModelsBtn.disabled = false;
    return;
  }

  log(t('log_export_models_start').replace('{n}', files.length) + '\n');

  // 单文件 → 直接下 .glb；多文件 → 打包 models.zip
  const single = files.length === 1;
  const zip = single ? null : new JSZip();

  let successCount = 0;

  for (let i = 0; i < files.length; i++) {
    const item = files[i];
    item.status = 'processing';
    renderFileList();

    try {
      const text = await item.file.text();
      const mapData = parseGbmap(text);
      const proj = buildProject(mapData);

      const glbBuffer = await mapDataToGLB(mapData, proj);
      const glbName = sanitizeName(mapData.map_name) + '.glb';

      if (single) {
        triggerDownload(new Blob([glbBuffer], { type: 'model/gltf-binary' }), glbName);
        log('[✓] ' + item.file.name + '  →  ' + glbName
          + '  (' + (glbBuffer.byteLength / 1024).toFixed(1) + ' KB)');
      } else {
        zip.file(glbName, glbBuffer);
        log('[✓] ' + item.file.name
          + '  (' + mapData.objects.length + ' ' + t('log_objects')
          + ', ' + (glbBuffer.byteLength / 1024).toFixed(1) + ' KB)');
      }

      item.status = 'done';
      item.result = proj;
      successCount++;
    } catch (e) {
      item.status = 'error';
      item.error = e.message;
      log('[✗] ' + item.file.name + '  ' + t('log_glb_fail') + ': ' + (e && e.message || e));
    }
    renderFileList();
  }

  log('\n' + t('log_export_models_done').replace('{s}', successCount).replace('{n}', files.length));

  if (!single && successCount > 0) {
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    triggerDownload(zipBlob, 'models.zip');
    log(t('log_export_models_zip'));
  }

  convertBtn.disabled = false;
  exportModelsBtn.disabled = false;
});

// ========== 下载全部（zip） ==========
downloadBtn.addEventListener('click', () => {
  if (!outputBlob) return;
  triggerDownload(outputBlob, 'converted_projects.zip');
});

// ========== 语言初始化 ==========
function selectLang(lang) {
  currentLang = lang;
  try { localStorage.setItem('gbmap_lang', lang); } catch(e) {}
  applyLang();
  const modal = document.getElementById('langModal');
  if (modal) modal.classList.add('hidden');
}
window.selectLang = selectLang;

(function initLang() {
  let saved = null;
  try { saved = localStorage.getItem('gbmap_lang'); } catch(e) {}
  if (saved === 'zh' || saved === 'en') {
    currentLang = saved;
    applyLang();
    const modal = document.getElementById('langModal');
    if (modal) modal.classList.add('hidden');
  }
})();

// ========== 窗口拖动（装饰性） ==========
(function enableWindowDrag() {
  const win = document.getElementById('appWindow');
  const bar = document.getElementById('titlebar');
  let dragging = false, startX = 0, startY = 0, offX = 0, offY = 0;

  bar.addEventListener('mousedown', e => {
    if (e.target.closest('.tbtn')) return;
    dragging = true;
    startX = e.clientX - offX;
    startY = e.clientY - offY;
    document.body.style.userSelect = 'none';
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    offX = e.clientX - startX;
    offY = e.clientY - startY;
    win.style.transform = 'translate(' + offX + 'px,' + offY + 'px)';
  });

  window.addEventListener('mouseup', () => {
    dragging = false;
    document.body.style.userSelect = '';
  });
})();
</script>
